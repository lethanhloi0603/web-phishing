<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
  <title id="title">Giao thức đánh giá chống rò rỉ dữ liệu</title><desc id="desc">Train được chia OOF theo domain; validation kiểm tra; test khóa chỉ dùng một lần.</desc>
  <defs><style>.title{font:700 29px Arial;fill:#17324d}.h{font:700 19px Arial;fill:#17324d}.t{font:15px Arial;fill:#29465f}.a{stroke:#557a95;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#557a95"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="610" fill="#f7fafc"/><text x="700" y="48" text-anchor="middle" class="title">GIAO THỨC HUẤN LUYỆN VÀ ĐÁNH GIÁ</text>
  <g filter="url(#s)"><rect x="55" y="105" width="250" height="155" rx="18" fill="#e8f3ff" stroke="#4b91d1" stroke-width="2"/><text x="180" y="145" text-anchor="middle" class="h">TRAIN</text><text x="85" y="182" class="t">5-fold StratifiedGroupKFold</text><text x="85" y="212" class="t">Nhóm theo domain</text><text x="85" y="239" class="t">Sinh dự đoán OOF</text>
  <rect x="385" y="105" width="270" height="155" rx="18" fill="#fff5df" stroke="#d89a27" stroke-width="2"/><text x="520" y="145" text-anchor="middle" class="h">OOF TRAIN</text><text x="415" y="182" class="t">Chọn ngưỡng</text><text x="415" y="212" class="t">Học trọng số voting</text><text x="415" y="239" class="t">Huấn luyện meta-model</text>
  <rect x="735" y="105" width="250" height="155" rx="18" fill="#eaf8f1" stroke="#3d9b72" stroke-width="2"/><text x="860" y="145" text-anchor="middle" class="h">VALIDATION</text><text x="765" y="182" class="t">Kiểm tra tính hợp lý</text><text x="765" y="212" class="t">Không huấn luyện lại</text><text x="765" y="239" class="t">Không mở khóa test</text>
  <rect x="1065" y="105" width="280" height="155" rx="18" fill="#ffecef" stroke="#c75b70" stroke-width="2"/><text x="1205" y="145" text-anchor="middle" class="h">LOCKED TEST</text><text x="1095" y="182" class="t">Đánh giá cuối cùng một lần</text><text x="1095" y="212" class="t">Không chọn mô hình/ngưỡng</text><text x="1095" y="239" class="t">Báo cáo metric và CI 95%</text></g>
  <path class="a" d="M305 183H380"/><path class="a" d="M655 183H730"/><path class="a" d="M985 183H1060"/>
  <g filter="url(#s)"><rect x="205" y="360" width="300" height="125" rx="18" fill="#fff" stroke="#657f91" stroke-width="2"/><text x="355" y="400" text-anchor="middle" class="h">Mô hình đơn</text><text x="235" y="437" class="t">URL numeric, TF-IDF, HTML, DOM</text><text x="235" y="464" class="t">LR, SVM, RF, ET, HistGB</text>
  <rect x="550" y="360" width="300" height="125" rx="18" fill="#fff" stroke="#657f91" stroke-width="2"/><text x="700" y="400" text-anchor="middle" class="h">Mô hình kết hợp</text><text x="580" y="437" class="t">Soft voting, weighted voting</text><text x="580" y="464" class="t">OOF stacking</text>
  <rect x="895" y="360" width="300" height="125" rx="18" fill="#fff" stroke="#657f91" stroke-width="2"/><text x="1045" y="400" text-anchor="middle" class="h">Phân tích sau đánh giá</text><text x="925" y="437" class="t">Bootstrap theo domain, XAI</text><text x="925" y="464" class="t">Cross-dataset và TMĐT</text></g>
  <path class="a" d="M505 423H545"/><path class="a" d="M850 423H890"/><text x="700" y="555" text-anchor="middle" class="t">Nguyên tắc: mọi quyết định học từ train/OOF; test chỉ dùng để ước lượng hiệu quả cuối.</text>
</svg>
