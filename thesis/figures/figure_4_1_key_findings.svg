<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">Các phát hiện thực nghiệm chính</title><desc id="desc">So sánh kết quả tốt nhất trên PhishVN, Phish360 và kết quả chuyển giao chéo.</desc>
  <defs><style>.title{font:700 30px Arial;fill:#17324d}.h{font:700 21px Arial;fill:#17324d}.v{font:700 37px Arial;fill:#17324d}.t{font:15px Arial;fill:#29465f}.note{font:14px Arial;fill:#48657b}.bar{rx:7}</style><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="690" fill="#f7fafc"/><text x="700" y="50" text-anchor="middle" class="title">CÁC PHÁT HIỆN THỰC NGHIỆM CHÍNH</text>
  <g filter="url(#s)"><rect x="55" y="95" width="400" height="245" rx="20" fill="#e8f3ff" stroke="#4b91d1" stroke-width="2"/><text x="255" y="137" text-anchor="middle" class="h">PHISHVN</text><text x="255" y="193" text-anchor="middle" class="v">PR-AUC 0,9890</text><text x="255" y="230" text-anchor="middle" class="t">URL TF-IDF Logistic Regression</text><text x="255" y="272" text-anchor="middle" class="t">Stacking: F1 0,9441 • MCC 0,8696</text><text x="255" y="307" text-anchor="middle" class="note">Mô hình đơn thắng PR-AUC; stacking cân bằng hơn.</text>
  <rect x="500" y="95" width="400" height="245" rx="20" fill="#eaf8f1" stroke="#3d9b72" stroke-width="2"/><text x="700" y="137" text-anchor="middle" class="h">PHISH360</text><text x="700" y="193" text-anchor="middle" class="v">PR-AUC 0,9950</text><text x="700" y="230" text-anchor="middle" class="t">Weighted soft voting</text><text x="700" y="272" text-anchor="middle" class="t">F1 0,9635 • MCC 0,9328</text><text x="700" y="307" text-anchor="middle" class="note">Kết hợp URL, HTML và DOM cho hiệu quả cao nhất.</text>
  <rect x="945" y="95" width="400" height="245" rx="20" fill="#fff0e7" stroke="#d77b38" stroke-width="2"/><text x="1145" y="137" text-anchor="middle" class="h">CROSS-DATASET</text><text x="1145" y="193" text-anchor="middle" class="v">PR-AUC TB 0,4915</text><text x="1145" y="230" text-anchor="middle" class="t">Chuyển giao hai chiều</text><text x="1145" y="272" text-anchor="middle" class="t">MCC có thể gần 0 hoặc âm</text><text x="1145" y="307" text-anchor="middle" class="note">Dataset shift là hạn chế nổi bật.</text></g>
  <text x="80" y="410" class="h">PR-AUC: nội bộ so với chuyển giao</text>
  <text x="80" y="457" class="t">PhishVN nội bộ</text><rect class="bar" x="270" y="436" width="890" height="28" fill="#4b91d1"/><text x="1175" y="457" class="t">0,989</text>
  <text x="80" y="510" class="t">Phish360 nội bộ</text><rect class="bar" x="270" y="489" width="895" height="28" fill="#3d9b72"/><text x="1180" y="510" class="t">0,995</text>
  <text x="80" y="563" class="t">Cross-dataset TB</text><rect class="bar" x="270" y="542" width="442" height="28" fill="#d77b38"/><text x="727" y="563" class="t">0,491</text>
  <line x1="270" y1="596" x2="1170" y2="596" stroke="#8ba0af" stroke-width="2"/><text x="270" y="625" text-anchor="middle" class="note">0</text><text x="720" y="625" text-anchor="middle" class="note">0,5</text><text x="1170" y="625" text-anchor="middle" class="note">1,0</text>
  <text x="700" y="665" text-anchor="middle" class="note">Kết quả nội bộ cao không đồng nghĩa với khả năng tổng quát hóa tốt trên nguồn dữ liệu mới.</text>
</svg>
