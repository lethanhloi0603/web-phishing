seed: 42

# Storage-aware defaults for a machine with limited free disk space.
data:
  phresh_samples_per_class_train: 2000
  phresh_samples_per_class_test: 1000
  max_html_chars: 50000
  strict_template_isolation: false
  compression: gzip

model:
  model_name: google/mobilebert-uncased
  max_html_length: 256
  max_dom_length: 256
  dom_vocab_size: 512
  dom_hidden_size: 128
  dom_layers: 2
  dom_heads: 4
  static_hidden_size: 64
  fusion_hidden_size: 256
  projection_size: 128
  dropout: 0.2
  use_html: true
  use_dom: true
  use_static: true
  fusion_type: gated
  modality_dropout: 0.1

training:
  epochs: 5
  batch_size: 8
  html_learning_rate: 0.00002
  head_learning_rate: 0.001
  weight_decay: 0.01
  balanced_sampling: true
  lambda_supcon: 0.05
  lambda_adversarial: 0.02
  lambda_alignment: 0.2
  lambda_artifact_consistency: 0.1
  temperature: 0.1
  cross_generator_weight: 2.0
  auxiliary_warmup_epochs: 1.0
  artifact_augmentation_probability: 0.3
  artifact_augmentation_modes: [comments_removed, identifiers_normalized, visible_text_removed]
  target_fpr: 0.01
  fpr_confidence: 0.95
  early_stopping_patience: 2
  minimum_free_disk_gb: 5.0
  default_seeds: [42, 43, 44, 45, 46]

publication:
  min_test_positives: 100
  min_test_positive_sites: 20
  min_heldout_positive_pages: 100
  min_heldout_positive_sites: 50
  min_heldout_positive_templates: 100
  min_heldout_positive_brands: 3
  preferred_test_positives: 300
  require_manual_llm_validation: true
  require_strict_template_isolation: true
  bootstrap_samples: 10000
  min_primary_seeds: 5
  min_double_annotated: 100
  min_cohen_kappa: 0.8
  min_external_positives: 100
  min_external_negatives: 100
  min_external_seeds: 5
